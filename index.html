<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DGIFOZ Comunicação Visual — sistema web de gerenciamento e acompanhamento de pedidos.">
  <title>DGIFOZ • Gestão de Pedidos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="assets/dgi.jfif" alt="DGIFOZ"></div>
        <div>
          <strong>DGIFOZ</strong>
          <span>Comunicação Visual</span>
        </div>
      </div>

      <div class="workspace">
        <span class="eyebrow">PAINEL</span>
        <div class="workspace-card">
          <div class="workspace-icon">D</div>
          <div>
            <strong>DGI Impressão Digital</strong>
            <span>Operação principal</span>
          </div>
          <span class="status-dot"></span>
        </div>
      </div>

      <nav class="nav" aria-label="Navegação principal">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button class="nav-item" data-page="pedidos"><span class="nav-icon">▤</span>Pedidos</button>
        <button class="nav-item" data-page="clientes"><span class="nav-icon">♙</span>Clientes</button>
        <button class="nav-item" data-page="empresa"><span class="nav-icon">▦</span>Empresa</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <span class="help-badge">?</span>
          <div>
            <strong>Centralizado.</strong>
            <p>Todos os pedidos em um só lugar.</p>
          </div>
        </div>
        <div class="user-mini">
          <div class="avatar">LF</div>
          <div><strong>Administrador</strong><span>Acesso interno</span></div>
          <button class="icon-btn" title="Opções">•••</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
        <div class="breadcrumbs"><span>DGIFOZ</span><b>/</b><strong id="pageLabel">Dashboard</strong></div>
        <div class="top-actions">
          <div class="search-mini">
            <span>⌕</span>
            <input id="globalSearch" type="search" placeholder="Buscar pedido, cliente...">
            <kbd>⌘ K</kbd>
          </div>
          <button class="circle-btn" title="Notificações">♢<span class="notif"></span></button>
          <div class="avatar avatar-dark">LF</div>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
